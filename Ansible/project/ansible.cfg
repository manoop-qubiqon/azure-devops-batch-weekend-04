[defaults]
inventory            = ./azure_rm.yml
remote_user          = azureuser
host_key_checking    = False
private_key_file     = ~/.ssh/id_rsa
interpreter_python   = auto_silent
roles_path           = ./roles

[inventory]
enable_plugins = azure.azcollection.azure_rm

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
