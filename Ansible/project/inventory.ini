# OPTIONAL static fallback — use this if you don't have Azure access
# or want to run against any 3 Ubuntu machines.
#
# 1. Replace the IPs below with the public IPs from `terraform output`
#    (or any 3 Ubuntu hosts you can SSH into).
# 2. Run playbooks with:  -i inventory.ini   instead of  -i azure_rm.yml
#
# The group names (tag_role_web / tag_role_lb) intentionally match what the
# Azure dynamic inventory produces, so site.yml works with either inventory.

[tag_role_web]
web1 ansible_host=REPLACE_WEB1_PUBLIC_IP web_private_ip=REPLACE_WEB1_PRIVATE_IP
web2 ansible_host=REPLACE_WEB2_PUBLIC_IP web_private_ip=REPLACE_WEB2_PRIVATE_IP

[tag_role_lb]
lb ansible_host=REPLACE_LB_PUBLIC_IP

[all:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
